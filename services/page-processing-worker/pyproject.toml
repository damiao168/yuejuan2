[project]
name = "edugrade-page-processing-worker"
version = "0.1.0"
description = "EduGrade capture file decoder and page preparation worker"
requires-python = ">=3.11,<3.13"
dependencies = [
  "edugrade-worker-runtime==0.1.0",
  "numpy==2.4.6",
  "opencv-python-headless==5.0.0.93",
  "pillow==12.3.0",
  "pypdfium2==5.12.1",
  "zxing-cpp==3.1.0",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["page_processing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
