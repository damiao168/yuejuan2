[project]
name = "edugrade-math-verification-worker"
version = "0.1.0"
description = "Restricted mathematical AST parser and symbolic verification service"
requires-python = ">=3.11,<3.13"
dependencies = ["sympy==1.14.0"]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["math_verification_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
