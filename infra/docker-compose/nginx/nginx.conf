# Compose 重建容器后地址可能变化，使用 Docker DNS 定期重新解析上游。
upstream edugrade_api {
  zone edugrade_api 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server api-gateway:8080 resolve;
}

upstream edugrade_web {
  zone edugrade_web 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server web-admin:80 resolve;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 110m;

  # Baseline security headers for every proxied response. `always` keeps them
  # on error responses too. TLS termination (443 + HSTS) is expected in front
  # of or on this server for production; pair it with
  # EDUGRADE_SESSION_COOKIE_SECURE=true.
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

  location = /health {
    access_log off;
    return 200 "nginx ok\n";
    # nginx only inherits add_header from an outer block when the current block
    # declares none, so the server-level security headers must be repeated here.
    add_header Content-Type text/plain;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  }

  location = /health/live {
    access_log off;
    proxy_pass http://edugrade_api/health/live;
  }

  location = /health/ready {
    access_log off;
    proxy_pass http://edugrade_api/health/ready;
  }

  location /api/ {
    proxy_pass http://edugrade_api;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 780s;
    proxy_read_timeout 780s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ready {
    proxy_pass http://edugrade_api;
  }

  location /backend-health {
    proxy_pass http://edugrade_api/health/live;
  }

  location / {
    proxy_pass http://edugrade_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
