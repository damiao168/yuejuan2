# Compose 重建容器后地址可能变化，使用 Docker DNS 定期重新解析上游。
upstream edugrade_api {
  zone edugrade_api 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server api-gateway:8080 resolve;
}

upstream edugrade_web {
  zone edugrade_web 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server web-admin:80 resolve;
}

server {
  listen 80;
  server_name _;

  # 上游不按公网域名分租户，Host 使用固定 proxy_pass 的 authority。
  # 每个代理块同时清除外部 Forwarded authority，不能只依赖服务器级继承。

  client_max_body_size 110m;

  # 为每个代理响应设置基础安全响应头。`always` 使错误响应
  # 也保留这些响应头。生产环境应在本服务器前方或本服务器上
  # 终止 TLS（443 + HSTS），同时配合
  # 设置 EDUGRADE_SESSION_COOKIE_SECURE=true。
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

  location = /health {
    access_log off;
    return 200 "nginx ok\n";
    # 只有当前块没有声明 add_header 时，nginx 才会从外层块继承；
    # 因此这里必须重复声明服务器级安全响应头。
    add_header Content-Type text/plain;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  }

  location = /health/live {
    access_log off;
    proxy_pass http://edugrade_api/health/live;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
  }

  location = /health/ready {
    access_log off;
    proxy_pass http://edugrade_api/health/ready;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
  }

  location /api/ {
    proxy_pass http://edugrade_api;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 780s;
    proxy_read_timeout 780s;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ready {
    proxy_pass http://edugrade_api;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
  }

  location /backend-health {
    proxy_pass http://edugrade_api/health/live;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
  }

  # 代理与静态服务的 CSP 会同时执行；只在本地 OCR Worker 路径共同允许 WASM。
  # 当前层声明 add_header 后不再继承，其余安全头与原前端代理 authority 约束一并保留。
  location ~ ^/assets/worker\.min-[A-Za-z0-9_-]+\.js$ {
    proxy_pass http://edugrade_web;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  }

  location / {
    proxy_pass http://edugrade_web;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
