# STORY-056 OMR 页面处理工作进程路径的隔离验收环境。
# 不要将此文件合入 docker-compose.yml：这里有意不使用
# 固定容器名、固定主机端口或生产数据卷。可选的
# 浏览器网关绑定临时回环端口，用于真实 Playwright 检查。
# 端到端测试运行器会在此临时数据库中
# 直接写入已完成上游采集和登记的测试数据；
# 这不代表采集和登记流水线已通过验收。
# 通过 scripts/run-story056-real-worker-e2e.ps1 调用，该脚本会分配
# 唯一的 Compose 项目名，且只移除该项目的资源。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edugrade
      POSTGRES_USER: edugrade
      POSTGRES_PASSWORD: ${EDUGRADE_STORY056_POSTGRES_PASSWORD:?run the supplied E2E PowerShell runner}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edugrade -d edugrade"]
      interval: 2s
      timeout: 2s
      retries: 45

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 45

  minio:
    image: ${EDUGRADE_MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z}
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: story056e2e
      MINIO_ROOT_PASSWORD: ${EDUGRADE_STORY056_MINIO_SECRET:?run the supplied E2E PowerShell runner}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 2s
      timeout: 2s
      retries: 60

  db-migrate:
    image: postgres:16-alpine
    environment:
      EDUGRADE_POSTGRES_DSN: postgres://edugrade:${EDUGRADE_STORY056_POSTGRES_PASSWORD:?run the supplied E2E PowerShell runner}@postgres:5432/edugrade?sslmode=disable
    volumes:
      - ../../services/api-gateway/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql "$${EDUGRADE_POSTGRES_DSN}" -v ON_ERROR_STOP=1 -c "
          CREATE TABLE IF NOT EXISTS schema_migration (
            filename TEXT PRIMARY KEY,
            checksum TEXT NOT NULL,
            applied_at TIMESTAMPTZ NOT NULL DEFAULT now()
          )"
        for file in /migrations/*.sql; do
          filename="$$(basename "$${file}")"
          checksum="$$(sha256sum "$${file}" | awk '{print $$1}')"
          stored="$$(psql "$${EDUGRADE_POSTGRES_DSN}" -Atc "SELECT checksum FROM schema_migration WHERE filename = '$${filename}'")"
          if [ -n "$${stored}" ]; then
            if [ "$${stored}" != "$${checksum}" ]; then
              echo "checksum mismatch for applied migration $${filename}" >&2
              exit 43
            fi
            continue
          fi
          { cat "$${file}"; printf "\nINSERT INTO schema_migration (filename, checksum) VALUES ('%s', '%s');\n" "$${filename}" "$${checksum}"; } |
            psql "$${EDUGRADE_POSTGRES_DSN}" -v ON_ERROR_STOP=1 -1
        done
    restart: "no"

  minio-init:
    image: ${EDUGRADE_MINIO_MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z}
    environment:
      EDUGRADE_MINIO_APP_ACCESS_KEY: story056e2e
      EDUGRADE_MINIO_APP_SECRET_KEY: ${EDUGRADE_STORY056_MINIO_SECRET:?run the supplied E2E PowerShell runner}
      EDUGRADE_FILE_BUCKET: story056-e2e-files
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set e2e http://minio:9000 "$${EDUGRADE_MINIO_APP_ACCESS_KEY}" "$${EDUGRADE_MINIO_APP_SECRET_KEY}"
        mc mb --ignore-existing "e2e/$${EDUGRADE_FILE_BUCKET}"
        mc anonymous set none "e2e/$${EDUGRADE_FILE_BUCKET}"
    restart: "no"

  bootstrap-admin:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    entrypoint: ["api-gateway", "bootstrap-admin"]
    environment:
      EDUGRADE_ENV: test
      EDUGRADE_LOG_LEVEL: error
      EDUGRADE_POSTGRES_DSN: postgres://edugrade:${EDUGRADE_STORY056_POSTGRES_PASSWORD:?run the supplied E2E PowerShell runner}@postgres:5432/edugrade?sslmode=disable
      EDUGRADE_MINIO_APP_ACCESS_KEY: story056e2e
      EDUGRADE_MINIO_APP_SECRET_KEY: ${EDUGRADE_STORY056_MINIO_SECRET:?run the supplied E2E PowerShell runner}
      EDUGRADE_BOOTSTRAP_TENANT_CODE: platform
      EDUGRADE_BOOTSTRAP_ROLE_CODE: platform_admin
      EDUGRADE_BOOTSTRAP_USERNAME: platform_admin
      EDUGRADE_BOOTSTRAP_DISPLAY_NAME: STORY-056 E2E Platform Admin
      EDUGRADE_BOOTSTRAP_PASSWORD: ${EDUGRADE_E2E_ADMIN_PASSWORD:?run the supplied E2E PowerShell runner}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: "no"

  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    environment:
      EDUGRADE_ENV: test
      EDUGRADE_SERVICE_NAME: story056-e2e-api
      EDUGRADE_HTTP_HOST: 0.0.0.0
      EDUGRADE_HTTP_PORT: 8080
      EDUGRADE_LOG_LEVEL: error
      EDUGRADE_READINESS_TIMEOUT: 2s
      EDUGRADE_SHUTDOWN_TIMEOUT: 5s
      EDUGRADE_SESSION_COOKIE_SECURE: "false"
      EDUGRADE_POSTGRES_DSN: postgres://edugrade:${EDUGRADE_STORY056_POSTGRES_PASSWORD:?run the supplied E2E PowerShell runner}@postgres:5432/edugrade?sslmode=disable
      EDUGRADE_REDIS_ADDR: redis:6379
      EDUGRADE_REDIS_PASSWORD: ""
      EDUGRADE_REDIS_DB: "0"
      EDUGRADE_MINIO_ENDPOINT: minio:9000
      EDUGRADE_MINIO_APP_ACCESS_KEY: story056e2e
      EDUGRADE_MINIO_APP_SECRET_KEY: ${EDUGRADE_STORY056_MINIO_SECRET:?run the supplied E2E PowerShell runner}
      EDUGRADE_MINIO_USE_SSL: "false"
      EDUGRADE_FILE_BUCKET: story056-e2e-files
      EDUGRADE_FILE_MAX_UPLOAD_BYTES: "10485760"
      EDUGRADE_FILE_ALLOWED_EXTENSIONS: .png,.pdf
      EDUGRADE_BARCODE_ACTIVE_KEY_ID: e2e-v1
      EDUGRADE_BARCODE_HMAC_KEYS: e2e-v1:story056-e2e-barcode-key-at-least-32-chars
      EDUGRADE_QDRANT_URL: ""
      EDUGRADE_AI_SERVICE_URL: ""
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      bootstrap-admin:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health/ready | grep -q '\"status\":\"ready\"'"]
      interval: 2s
      timeout: 2s
      retries: 60

  e2e-runner:
    build:
      context: ../..
      dockerfile: services/api-gateway/tools/story056-real-worker-e2e/Dockerfile
    environment:
      EDUGRADE_E2E_API_BASE_URL: http://api-gateway:8080
      EDUGRADE_E2E_POSTGRES_DSN: postgres://edugrade:${EDUGRADE_STORY056_POSTGRES_PASSWORD:?run the supplied E2E PowerShell runner}@postgres:5432/edugrade?sslmode=disable
      EDUGRADE_E2E_ADMIN_PASSWORD: ${EDUGRADE_E2E_ADMIN_PASSWORD:?run the supplied E2E PowerShell runner}
      EDUGRADE_E2E_WORKER_USERNAME: story056_e2e_worker
      EDUGRADE_E2E_WORKER_PASSWORD: ${EDUGRADE_E2E_WORKER_PASSWORD:?run the supplied E2E PowerShell runner}
      EDUGRADE_E2E_UNPRIVILEGED_USERNAME: story056_e2e_unprivileged
      EDUGRADE_E2E_UNPRIVILEGED_PASSWORD: ${EDUGRADE_E2E_UNPRIVILEGED_PASSWORD:?run the supplied E2E PowerShell runner}
      EDUGRADE_E2E_RUN_KEY: story056-real-worker-e2e-v1
    depends_on:
      api-gateway:
        condition: service_healthy
    profiles: ["e2e"]

  postgres-e2e-tests:
    build:
      context: ../..
      dockerfile: services/api-gateway/tools/story056-postgres-e2e/Dockerfile
    environment:
      EDUGRADE_E2E_DATABASE_URL: postgres://edugrade:${EDUGRADE_STORY056_POSTGRES_PASSWORD:?run the supplied E2E PowerShell runner}@postgres:5432/edugrade?sslmode=disable
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    profiles: ["e2e"]

  page-processing-once:
    build:
      context: ../..
      dockerfile: services/page-processing-worker/Dockerfile
    command: ["python", "-m", "page_processing", "--once"]
    environment:
      EDUGRADE_API_BASE_URL: http://api-gateway:8080
      EDUGRADE_PAGE_PROCESSING_TENANT_CODE: platform
      EDUGRADE_PAGE_PROCESSING_USERNAME: story056_e2e_worker
      EDUGRADE_PAGE_PROCESSING_PASSWORD: ${EDUGRADE_E2E_WORKER_PASSWORD:?run the supplied E2E PowerShell runner}
      EDUGRADE_PAGE_PROCESSING_BATCH_SIZE: "1"
      EDUGRADE_PAGE_PROCESSING_LEASE_SECONDS: "120"
      EDUGRADE_PAGE_PROCESSING_WORKER_ID: story056-real-worker-e2e
    depends_on:
      api-gateway:
        condition: service_healthy
    profiles: ["e2e"]

  web-admin:
    build:
      context: ../..
      dockerfile: apps/web-admin/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health | grep -q web-admin"]
      interval: 2s
      timeout: 2s
      retries: 60
    profiles: ["e2e"]

  browser-gateway:
    image: nginx:1.29-alpine
    volumes:
      - ./nginx/story056-e2e.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1::80"
    depends_on:
      web-admin:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health | grep -q story056-browser-gateway"]
      interval: 2s
      timeout: 2s
      retries: 60
    profiles: ["e2e"]

volumes:
  postgres_data:
  minio_data:
