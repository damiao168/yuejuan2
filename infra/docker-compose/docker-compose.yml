name: edugrade-enterprise

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${EDUGRADE_CONTAINER_LOG_MAX_SIZE:-10m}
    max-file: ${EDUGRADE_CONTAINER_LOG_MAX_FILES:-5}

services:
  postgres:
    image: ${EDUGRADE_POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: edugrade-postgres
    environment:
      POSTGRES_DB: ${EDUGRADE_POSTGRES_DB}
      POSTGRES_USER: ${EDUGRADE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${EDUGRADE_POSTGRES_PASSWORD}
    # Data-plane ports bind to loopback by default; production deployments
    # should only expose nginx. Override EDUGRADE_INTERNAL_BIND_HOST for
    # isolated development hosts that genuinely need LAN access.
    ports:
      - "${EDUGRADE_INTERNAL_BIND_HOST:-127.0.0.1}:${EDUGRADE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: ${EDUGRADE_POSTGRES_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: ${EDUGRADE_REDIS_IMAGE:-redis:7-alpine}
    container_name: edugrade-redis
    command:
      - /bin/sh
      - -ec
      - |
        if [ -z "$${EDUGRADE_REDIS_USERNAME}" ] || [ -z "$${EDUGRADE_REDIS_PASSWORD}" ]; then
          echo "Redis ACL username and password are required; refusing to start unauthenticated" >&2
          exit 1
        fi
        case "$${EDUGRADE_REDIS_USERNAME}" in
          *[!A-Za-z0-9._-]*) echo "Redis ACL username contains unsupported characters" >&2; exit 1 ;;
        esac
        password_hash="$$(printf '%s' "$${EDUGRADE_REDIS_PASSWORD}" | sha256sum | cut -d ' ' -f 1)"
        printf 'user default off\nuser %s on #%s ~* +@all -@admin -@dangerous\n' \
          "$${EDUGRADE_REDIS_USERNAME}" "$${password_hash}" > /tmp/users.acl
        chmod 600 /tmp/users.acl
        if [ "$${EDUGRADE_REDIS_TLS_ENABLED}" = "true" ]; then
          exec redis-server --appendonly yes --aclfile /tmp/users.acl --port 0 --tls-port 6379 \
            --tls-cert-file /run/secrets/redis/server.crt \
            --tls-key-file /run/secrets/redis/server.key \
            --tls-ca-cert-file /run/secrets/redis/ca.crt \
            --tls-auth-clients no
        fi
        exec redis-server --appendonly yes --aclfile /tmp/users.acl
    environment:
      EDUGRADE_REDIS_USERNAME: ${EDUGRADE_REDIS_USERNAME:-edugrade-api}
      EDUGRADE_REDIS_PASSWORD: ${EDUGRADE_REDIS_PASSWORD}
      EDUGRADE_REDIS_TLS_ENABLED: ${EDUGRADE_REDIS_TLS_ENABLED:-false}
      EDUGRADE_REDIS_TLS_SERVER_NAME: ${EDUGRADE_REDIS_TLS_SERVER_NAME:-redis}
    ports:
      - "${EDUGRADE_INTERNAL_BIND_HOST:-127.0.0.1}:${EDUGRADE_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ${EDUGRADE_REDIS_CERTS_DIR:-./certs/redis}:/run/secrets/redis:ro
    mem_limit: ${EDUGRADE_REDIS_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "if [ \"$${EDUGRADE_REDIS_TLS_ENABLED}\" = \"true\" ]; then redis-cli --tls --cacert /run/secrets/redis/ca.crt --sni \"$${EDUGRADE_REDIS_TLS_SERVER_NAME}\" -h redis --user \"$${EDUGRADE_REDIS_USERNAME}\" -a \"$${EDUGRADE_REDIS_PASSWORD}\" ping; else redis-cli --user \"$${EDUGRADE_REDIS_USERNAME}\" -a \"$${EDUGRADE_REDIS_PASSWORD}\" ping; fi | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging
    restart: unless-stopped

  minio:
    image: ${EDUGRADE_MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z}
    container_name: edugrade-minio
    command: server --certs-dir /root/.minio/certs /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${EDUGRADE_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${EDUGRADE_MINIO_ROOT_PASSWORD}
      EDUGRADE_MINIO_USE_SSL: ${EDUGRADE_MINIO_USE_SSL:-false}
    ports:
      - "${EDUGRADE_INTERNAL_BIND_HOST:-127.0.0.1}:${EDUGRADE_MINIO_API_PORT:-9000}:9000"
      - "${EDUGRADE_INTERNAL_BIND_HOST:-127.0.0.1}:${EDUGRADE_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
      - ${EDUGRADE_MINIO_CERTS_DIR:-./certs/minio}:/root/.minio/certs:ro
      - ${EDUGRADE_MINIO_CA_DIR:-./certs/minio-ca}:/root/.mc/certs/CAs:ro
    mem_limit: ${EDUGRADE_MINIO_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD-SHELL", "scheme=http; if [ \"$${EDUGRADE_MINIO_USE_SSL}\" = \"true\" ]; then scheme=https; fi; mc alias set health \"$${scheme}://minio:9000\" \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" >/dev/null && mc ready health"]
      interval: 10s
      timeout: 5s
      retries: 18
    logging: *default-logging
    restart: unless-stopped

  qdrant:
    image: ${EDUGRADE_QDRANT_IMAGE:-qdrant/qdrant:v1.14.1}
    container_name: edugrade-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${EDUGRADE_QDRANT_API_KEY:?EDUGRADE_QDRANT_API_KEY is required; see infra/docker-compose/README.md upgrade notes}
    ports:
      - "${EDUGRADE_INTERNAL_BIND_HOST:-127.0.0.1}:${EDUGRADE_QDRANT_HTTP_PORT:-6333}:6333"
      - "${EDUGRADE_INTERNAL_BIND_HOST:-127.0.0.1}:${EDUGRADE_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: ${EDUGRADE_QDRANT_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD-SHELL", "grep -qi ':18BD' /proc/net/tcp"]
      interval: 10s
      timeout: 5s
      retries: 18
    logging: *default-logging
    restart: unless-stopped

  db-migrate:
    image: ${EDUGRADE_POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: edugrade-db-migrate
    profiles: ["tools"]
    environment:
      EDUGRADE_POSTGRES_ADMIN_DSN: ${EDUGRADE_POSTGRES_ADMIN_DSN}
      EDUGRADE_POSTGRES_APP_USER: ${EDUGRADE_POSTGRES_APP_USER}
      EDUGRADE_POSTGRES_APP_PASSWORD: ${EDUGRADE_POSTGRES_APP_PASSWORD}
      EDUGRADE_MIGRATION_BASELINE_VERSION: ${EDUGRADE_MIGRATION_BASELINE_VERSION:-}
    volumes:
      - ../../services/api-gateway/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        lock_log="$$(mktemp)"
        lock_app="edugrade-migrate-$${HOSTNAME}"
        case "$${EDUGRADE_POSTGRES_APP_USER}" in
          ''|*[!A-Za-z0-9_]*) echo "EDUGRADE_POSTGRES_APP_USER has an invalid role name" >&2; exit 45;;
        esac
        if [ "$${#EDUGRADE_POSTGRES_APP_USER}" -gt 63 ] || [ "$${#EDUGRADE_POSTGRES_APP_PASSWORD}" -lt 32 ]; then
          echo "PostgreSQL application identity does not meet deployment requirements" >&2
          exit 45
        fi
        PGAPPNAME="$${lock_app}" psql "$${EDUGRADE_POSTGRES_ADMIN_DSN}" -Atc "SELECT pg_advisory_lock(19770428061); SELECT pg_sleep(86400)" >"$${lock_log}" 2>&1 &
        lock_pid="$$!"
        cleanup_lock() {
          PGAPPNAME=edugrade-migrate-cleanup psql "$${EDUGRADE_POSTGRES_ADMIN_DSN}" -Atc "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE application_name = '$${lock_app}' AND pid <> pg_backend_pid()" >/dev/null 2>&1 || true
          kill "$${lock_pid}" 2>/dev/null || true
          wait "$${lock_pid}" 2>/dev/null || true
          rm -f "$${lock_log}"
        }
        trap cleanup_lock EXIT INT TERM
        acquired=false
        for attempt in $$(seq 1 120); do
          if ! kill -0 "$${lock_pid}" 2>/dev/null; then cat "$${lock_log}" >&2; exit 44; fi
          lock_granted="$$(PGAPPNAME=edugrade-migrate-probe psql "$${EDUGRADE_POSTGRES_ADMIN_DSN}" -Atc "SELECT EXISTS (SELECT 1 FROM pg_locks l JOIN pg_stat_activity a ON a.pid = l.pid WHERE l.locktype = 'advisory' AND l.granted AND a.application_name = '$${lock_app}')")"
          if [ "$${lock_granted}" = "t" ]; then acquired=true; break; fi
          sleep 1
        done
        if [ "$${acquired}" != "true" ]; then echo "timed out acquiring migration advisory lock" >&2; exit 44; fi
        psql "$${EDUGRADE_POSTGRES_ADMIN_DSN}" -v ON_ERROR_STOP=1 -c "
          CREATE TABLE IF NOT EXISTS schema_migration (
            filename TEXT PRIMARY KEY,
            checksum TEXT NOT NULL,
            applied_at TIMESTAMPTZ NOT NULL DEFAULT now()
          )"
        tracked_count="$$(psql "$${EDUGRADE_POSTGRES_ADMIN_DSN}" -Atc "SELECT count(*) FROM schema_migration")"
        legacy_schema="$$(psql "$${EDUGRADE_POSTGRES_ADMIN_DSN}" -Atc "SELECT CASE WHEN to_regclass('public.tenant') IS NULL THEN 0 ELSE 1 END")"
        if [ "$${tracked_count}" = "0" ] && [ "$${legacy_schema}" = "1" ]; then
          if [ -z "$${EDUGRADE_MIGRATION_BASELINE_VERSION}" ]; then
            echo "existing schema has no migration history; set an explicit EDUGRADE_MIGRATION_BASELINE_VERSION after verifying the schema" >&2
            exit 42
          fi
          if [ "$${EDUGRADE_MIGRATION_BASELINE_VERSION}" != "000020" ]; then
            echo "unsupported baseline version; this release has a verified fingerprint only for 000020" >&2
            exit 42
          fi
          psql "$${EDUGRADE_POSTGRES_ADMIN_DSN}" -v ON_ERROR_STOP=1 -f /migrations/baseline/000020_fingerprint.sql
          found_baseline=false
          for file in /migrations/*.sql; do
            filename="$$(basename "$${file}")"
            checksum="$$(sha256sum "$${file}" | awk '{print $$1}')"
            psql "$${EDUGRADE_POSTGRES_ADMIN_DSN}" -v ON_ERROR_STOP=1 -c "INSERT INTO schema_migration (filename, checksum) VALUES ('$${filename}', '$${checksum}') ON CONFLICT (filename) DO NOTHING"
            echo "baselined $${filename}"
            case "$${filename}" in "$${EDUGRADE_MIGRATION_BASELINE_VERSION}"_*) found_baseline=true; break;; esac
          done
          if [ "$${found_baseline}" != "true" ]; then echo "baseline migration file not found" >&2; exit 42; fi
        fi
        for file in /migrations/*.sql; do
          filename="$$(basename "$${file}")"
          checksum="$$(sha256sum "$${file}" | awk '{print $$1}')"
          stored="$$(psql "$${EDUGRADE_POSTGRES_ADMIN_DSN}" -Atc "SELECT checksum FROM schema_migration WHERE filename = '$${filename}'")"
          if [ -n "$${stored}" ]; then
            if [ "$${stored}" != "$${checksum}" ]; then
              # One deployed 000155 draft has a known checksum. Keep its true
              # history intact; 000162 adds the guards missing from that draft.
              if [ "$${filename}" = "000155_subjective_multi_agent_panel.sql" ] &&
                 [ "$${stored}" = "dfca807d099fe84d1f12d522c232c4120a617d31e2b659cc9e4426ae15c60c23" ] &&
                 [ "$${checksum}" = "82db290ede117015fe4dbd7d5d3c6a7ec1328f2713c9eb4ba2425e66ac82a146" ] &&
                 [ -f /migrations/000162_subjective_panel_legacy_hardening.sql ]; then
                echo "recognized historical 000155 panel schema; preserving checksum until 000162 hardening"
                continue
              fi
              echo "checksum mismatch for applied migration $${filename}" >&2
              exit 43
            fi
            echo "skipping $${filename}"
            continue
          fi
          echo "applying $${filename}"
          { cat "$${file}"; printf "\nINSERT INTO schema_migration (filename, checksum) VALUES ('%s', '%s');\n" "$${filename}" "$${checksum}"; } |
            psql "$${EDUGRADE_POSTGRES_ADMIN_DSN}" -v ON_ERROR_STOP=1 -1
        done
        psql "$${EDUGRADE_POSTGRES_ADMIN_DSN}" -v ON_ERROR_STOP=1 \
          --set=app_user="$${EDUGRADE_POSTGRES_APP_USER}" \
          --set=app_password="$${EDUGRADE_POSTGRES_APP_PASSWORD}" <<'SQL'
        SELECT format(
          'CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS PASSWORD %L',
          :'app_user', :'app_password'
        ) WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user') \gexec
        SELECT format(
          'ALTER ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS PASSWORD %L',
          :'app_user', :'app_password'
        ) \gexec
        SELECT format('GRANT edugrade_tenant_runtime TO %I', :'app_user') \gexec
        SQL

  minio-init:
    image: ${EDUGRADE_MINIO_MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z}
    container_name: edugrade-minio-init
    profiles: ["tools"]
    environment:
      EDUGRADE_MINIO_ROOT_USER: ${EDUGRADE_MINIO_ROOT_USER}
      EDUGRADE_MINIO_ROOT_PASSWORD: ${EDUGRADE_MINIO_ROOT_PASSWORD}
      EDUGRADE_MINIO_APP_ACCESS_KEY: ${EDUGRADE_MINIO_APP_ACCESS_KEY}
      EDUGRADE_MINIO_APP_SECRET_KEY: ${EDUGRADE_MINIO_APP_SECRET_KEY}
      EDUGRADE_MINIO_USE_SSL: ${EDUGRADE_MINIO_USE_SSL:-false}
      EDUGRADE_FILE_BUCKET: ${EDUGRADE_FILE_BUCKET}
    volumes:
      - ${EDUGRADE_MINIO_CA_DIR:-./certs/minio-ca}:/root/.mc/certs/CAs:ro
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        scheme=http
        if [ "$${EDUGRADE_MINIO_USE_SSL}" = "true" ]; then scheme=https; fi
        mc alias set edugrade "$${scheme}://minio:9000" "$${EDUGRADE_MINIO_ROOT_USER}" "$${EDUGRADE_MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "edugrade/$${EDUGRADE_FILE_BUCKET}"
        mc anonymous set none "edugrade/$${EDUGRADE_FILE_BUCKET}"
        cat >/tmp/edugrade-app-policy.json <<EOF
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::$${EDUGRADE_FILE_BUCKET}"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::$${EDUGRADE_FILE_BUCKET}/*"]}]}
        EOF
        mc admin policy create edugrade edugrade-app /tmp/edugrade-app-policy.json
        mc admin user add edugrade "$${EDUGRADE_MINIO_APP_ACCESS_KEY}" "$${EDUGRADE_MINIO_APP_SECRET_KEY}"
        mc admin policy attach edugrade edugrade-app --user "$${EDUGRADE_MINIO_APP_ACCESS_KEY}"
        mc ls "edugrade/$${EDUGRADE_FILE_BUCKET}"

  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
      args:
        GO_BUILD_IMAGE: ${EDUGRADE_GO_BUILD_IMAGE:-golang:1.26.6-alpine}
        API_RUNTIME_IMAGE: ${EDUGRADE_API_RUNTIME_IMAGE:-alpine:3.22}
        APP_VERSION: ${EDUGRADE_APP_VERSION:-dev}
        GIT_SHA: ${EDUGRADE_GIT_SHA:-unknown}
        BUILD_TIME: ${EDUGRADE_BUILD_TIME:-unknown}
        IMAGE_DIGEST: ${EDUGRADE_IMAGE_DIGEST:-unknown}
        RELEASE_ID: ${EDUGRADE_RELEASE_ID:-local}
        SCHEMA_VERSION: ${EDUGRADE_SCHEMA_VERSION:-000166}
        GOPROXY: ${EDUGRADE_GO_PROXY:-}
    image: ${EDUGRADE_API_GATEWAY_IMAGE:-edugrade/api-gateway:local}
    container_name: edugrade-api-gateway
    environment:
      EDUGRADE_ENV: ${EDUGRADE_ENV}
      EDUGRADE_SERVICE_NAME: api-gateway
      EDUGRADE_HTTP_HOST: 0.0.0.0
      EDUGRADE_HTTP_PORT: 8080
      EDUGRADE_LOG_LEVEL: ${EDUGRADE_LOG_LEVEL}
      EDUGRADE_READINESS_TIMEOUT: ${EDUGRADE_READINESS_TIMEOUT}
      EDUGRADE_SHUTDOWN_TIMEOUT: ${EDUGRADE_SHUTDOWN_TIMEOUT}
      EDUGRADE_SESSION_TTL: ${EDUGRADE_SESSION_TTL}
      EDUGRADE_REMEMBERED_SESSION_TTL: ${EDUGRADE_REMEMBERED_SESSION_TTL:-720h}
      EDUGRADE_PUBLIC_SESSION_TTL: ${EDUGRADE_PUBLIC_SESSION_TTL:-4h}
      EDUGRADE_RECENT_AUTH_TTL: ${EDUGRADE_RECENT_AUTH_TTL:-60m}
      EDUGRADE_LOGIN_FAILURE_LIMIT: ${EDUGRADE_LOGIN_FAILURE_LIMIT}
      EDUGRADE_LOGIN_FAILURE_WINDOW: ${EDUGRADE_LOGIN_FAILURE_WINDOW}
      EDUGRADE_SESSION_COOKIE_NAME: ${EDUGRADE_SESSION_COOKIE_NAME}
      EDUGRADE_DEVICE_COOKIE_NAME: ${EDUGRADE_DEVICE_COOKIE_NAME:-edugrade_device}
      EDUGRADE_SESSION_COOKIE_SECURE: ${EDUGRADE_SESSION_COOKIE_SECURE}
      EDUGRADE_AUTH_RISK_MODE: ${EDUGRADE_AUTH_RISK_MODE:-shadow}
      EDUGRADE_DEVICE_BINDING_TTL: ${EDUGRADE_DEVICE_BINDING_TTL:-4320h}
      EDUGRADE_MFA_ENABLED: ${EDUGRADE_MFA_ENABLED:-false}
      EDUGRADE_MFA_MASTER_KEY: ${EDUGRADE_MFA_MASTER_KEY:-}
      EDUGRADE_MFA_MASTER_KEY_FILE: ${EDUGRADE_MFA_MASTER_KEY_FILE:-}
      EDUGRADE_WECHAT_LOGIN_ENABLED: ${EDUGRADE_WECHAT_LOGIN_ENABLED:-false}
      EDUGRADE_WECHAT_APP_ID: ${EDUGRADE_WECHAT_APP_ID:-}
      EDUGRADE_WECHAT_APP_SECRET: ${EDUGRADE_WECHAT_APP_SECRET:-}
      EDUGRADE_WECHAT_APP_SECRET_FILE: ${EDUGRADE_WECHAT_APP_SECRET_FILE:-}
      EDUGRADE_WECHAT_REDIRECT_URL: ${EDUGRADE_WECHAT_REDIRECT_URL:-}
      EDUGRADE_WECHAT_CHALLENGE_TTL: ${EDUGRADE_WECHAT_CHALLENGE_TTL:-5m}
      EDUGRADE_HTTP_MAX_HEADER_BYTES: ${EDUGRADE_HTTP_MAX_HEADER_BYTES}
      EDUGRADE_MAX_REQUEST_BODY_BYTES: ${EDUGRADE_MAX_REQUEST_BODY_BYTES}
      EDUGRADE_HTTP_READ_HEADER_TIMEOUT: ${EDUGRADE_HTTP_READ_HEADER_TIMEOUT:-5s}
      EDUGRADE_HTTP_READ_TIMEOUT: ${EDUGRADE_HTTP_READ_TIMEOUT:-15s}
      EDUGRADE_HTTP_WRITE_TIMEOUT: ${EDUGRADE_HTTP_WRITE_TIMEOUT:-780s}
      EDUGRADE_HTTP_IDLE_TIMEOUT: ${EDUGRADE_HTTP_IDLE_TIMEOUT:-60s}
      EDUGRADE_INTERNAL_TLS_PORT: ${EDUGRADE_INTERNAL_TLS_PORT:-0}
      EDUGRADE_INTERNAL_TLS_CERT_FILE: ${EDUGRADE_INTERNAL_TLS_CERT_FILE:-}
      EDUGRADE_INTERNAL_TLS_KEY_FILE: ${EDUGRADE_INTERNAL_TLS_KEY_FILE:-}
      SSL_CERT_FILE: ${EDUGRADE_INTERNAL_CA_FILE:-}
      EDUGRADE_CORS_ALLOWED_ORIGINS: ${EDUGRADE_CORS_ALLOWED_ORIGINS}
      EDUGRADE_CORS_ALLOWED_METHODS: ${EDUGRADE_CORS_ALLOWED_METHODS}
      EDUGRADE_CORS_ALLOWED_HEADERS: ${EDUGRADE_CORS_ALLOWED_HEADERS}
      EDUGRADE_POSTGRES_DSN: ${EDUGRADE_POSTGRES_DSN}
      EDUGRADE_POSTGRES_DSN_FILE: ${EDUGRADE_POSTGRES_DSN_FILE:-}
      EDUGRADE_POSTGRES_TENANT_RLS: ${EDUGRADE_POSTGRES_TENANT_RLS:-}
      EDUGRADE_POSTGRES_MAX_OPEN_CONNS: ${EDUGRADE_POSTGRES_MAX_OPEN_CONNS:-10}
      EDUGRADE_POSTGRES_MAX_IDLE_CONNS: ${EDUGRADE_POSTGRES_MAX_IDLE_CONNS:-5}
      EDUGRADE_POSTGRES_CONN_MAX_LIFETIME: ${EDUGRADE_POSTGRES_CONN_MAX_LIFETIME:-30m}
      EDUGRADE_POSTGRES_CONN_MAX_IDLE_TIME: ${EDUGRADE_POSTGRES_CONN_MAX_IDLE_TIME:-5m}
      EDUGRADE_POSTGRES_STATEMENT_TIMEOUT: ${EDUGRADE_POSTGRES_STATEMENT_TIMEOUT:-60s}
      EDUGRADE_POSTGRES_LOCK_TIMEOUT: ${EDUGRADE_POSTGRES_LOCK_TIMEOUT:-5s}
      EDUGRADE_REDIS_ADDR: redis:6379
      EDUGRADE_REDIS_USERNAME: ${EDUGRADE_REDIS_USERNAME:-edugrade-api}
      EDUGRADE_REDIS_PASSWORD: ${EDUGRADE_REDIS_PASSWORD}
      EDUGRADE_REDIS_PASSWORD_FILE: ${EDUGRADE_REDIS_PASSWORD_FILE:-}
      EDUGRADE_REDIS_DB: ${EDUGRADE_REDIS_DB}
      EDUGRADE_REDIS_TLS_ENABLED: ${EDUGRADE_REDIS_TLS_ENABLED:-false}
      EDUGRADE_REDIS_TLS_CA_FILE: ${EDUGRADE_REDIS_TLS_CA_FILE:-}
      EDUGRADE_REDIS_TLS_SERVER_NAME: ${EDUGRADE_REDIS_TLS_SERVER_NAME:-}
      EDUGRADE_AUTH_LIMITER_FAIL_CLOSED: ${EDUGRADE_AUTH_LIMITER_FAIL_CLOSED:-false}
      EDUGRADE_MINIO_ENDPOINT: minio:9000
      EDUGRADE_MINIO_APP_ACCESS_KEY: ${EDUGRADE_MINIO_APP_ACCESS_KEY}
      EDUGRADE_MINIO_APP_SECRET_KEY: ${EDUGRADE_MINIO_APP_SECRET_KEY}
      EDUGRADE_MINIO_APP_ACCESS_KEY_FILE: ${EDUGRADE_MINIO_APP_ACCESS_KEY_FILE:-}
      EDUGRADE_MINIO_APP_SECRET_KEY_FILE: ${EDUGRADE_MINIO_APP_SECRET_KEY_FILE:-}
      EDUGRADE_MINIO_USE_SSL: ${EDUGRADE_MINIO_USE_SSL:-false}
      EDUGRADE_MINIO_TLS_CA_FILE: ${EDUGRADE_MINIO_TLS_CA_FILE:-}
      EDUGRADE_MINIO_TLS_SERVER_NAME: ${EDUGRADE_MINIO_TLS_SERVER_NAME:-}
      EDUGRADE_FILE_BUCKET: ${EDUGRADE_FILE_BUCKET}
      EDUGRADE_FILE_MAX_UPLOAD_BYTES: ${EDUGRADE_FILE_MAX_UPLOAD_BYTES}
      EDUGRADE_FILE_ALLOWED_EXTENSIONS: ${EDUGRADE_FILE_ALLOWED_EXTENSIONS}
      EDUGRADE_FILE_RECONCILIATION_INTERVAL: ${EDUGRADE_FILE_RECONCILIATION_INTERVAL:-24h}
      EDUGRADE_FILE_RECONCILIATION_STALE_AFTER: ${EDUGRADE_FILE_RECONCILIATION_STALE_AFTER:-1h}
      EDUGRADE_FILE_RECONCILIATION_BATCH_SIZE: ${EDUGRADE_FILE_RECONCILIATION_BATCH_SIZE:-200}
      EDUGRADE_FILE_RECONCILIATION_OBJECT_LIMIT: ${EDUGRADE_FILE_RECONCILIATION_OBJECT_LIMIT:-1000}
      EDUGRADE_BARCODE_ACTIVE_KEY_ID: ${EDUGRADE_BARCODE_ACTIVE_KEY_ID}
      EDUGRADE_BARCODE_HMAC_KEYS: ${EDUGRADE_BARCODE_HMAC_KEYS}
      EDUGRADE_BARCODE_HMAC_KEYS_FILE: ${EDUGRADE_BARCODE_HMAC_KEYS_FILE:-}
