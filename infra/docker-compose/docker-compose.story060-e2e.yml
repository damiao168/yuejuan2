# Isolated STORY-060 acceptance environment. It has no fixed container names,
# host database ports, or shared production volumes. Run it under a unique
# Compose project and remove only that verified project after acceptance.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edugrade
      POSTGRES_USER: edugrade
      POSTGRES_PASSWORD: story060_e2e_postgres_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edugrade -d edugrade"]
      interval: 2s
      timeout: 2s
      retries: 60

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 60

  minio:
    # Same upstream image digest; the historical MinIO image includes mc.
    image: ${EDUGRADE_MINIO_IMAGE:-ghcr.io/l33tlamer/minio-backup@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e}
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: story060e2e
      MINIO_ROOT_PASSWORD: story060_e2e_minio_only_secret
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 2s
      timeout: 2s
      retries: 60

  db-migrate:
    image: postgres:16-alpine
    environment:
      EDUGRADE_POSTGRES_DSN: postgres://edugrade:story060_e2e_postgres_only@postgres:5432/edugrade?sslmode=disable
    volumes:
      - ../../services/api-gateway/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql "$${EDUGRADE_POSTGRES_DSN}" -v ON_ERROR_STOP=1 -c "
          CREATE TABLE IF NOT EXISTS schema_migration (
            filename TEXT PRIMARY KEY,
            checksum TEXT NOT NULL,
            applied_at TIMESTAMPTZ NOT NULL DEFAULT now()
          )"
        for file in /migrations/*.sql; do
          filename="$$(basename "$${file}")"
          checksum="$$(sha256sum "$${file}" | awk '{print $$1}')"
          stored="$$(psql "$${EDUGRADE_POSTGRES_DSN}" -Atc "SELECT checksum FROM schema_migration WHERE filename = '$${filename}'")"
          if [ -n "$${stored}" ]; then
            if [ "$${stored}" != "$${checksum}" ]; then
              echo "checksum mismatch for applied migration $${filename}" >&2
              exit 43
            fi
            continue
          fi
          { cat "$${file}"; printf "\nINSERT INTO schema_migration (filename, checksum) VALUES ('%s', '%s');\n" "$${filename}" "$${checksum}"; } |
            psql "$${EDUGRADE_POSTGRES_DSN}" -v ON_ERROR_STOP=1 -1
        done
    restart: "no"

  minio-init:
    image: ${EDUGRADE_MINIO_MC_IMAGE:-ghcr.io/l33tlamer/minio-backup@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set e2e http://minio:9000 story060e2e story060_e2e_minio_only_secret
        mc mb --ignore-existing e2e/story060-e2e-files
        mc anonymous set none e2e/story060-e2e-files
    restart: "no"

  bootstrap-admin:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    entrypoint: ["api-gateway", "bootstrap-admin"]
    environment:
      EDUGRADE_ENV: test
      EDUGRADE_LOG_LEVEL: error
      EDUGRADE_POSTGRES_DSN: postgres://edugrade:story060_e2e_postgres_only@postgres:5432/edugrade?sslmode=disable
      EDUGRADE_BOOTSTRAP_TENANT_CODE: platform
      EDUGRADE_BOOTSTRAP_ROLE_CODE: platform_admin
      EDUGRADE_BOOTSTRAP_USERNAME: platform_admin
      EDUGRADE_BOOTSTRAP_DISPLAY_NAME: STORY-060 E2E Platform Admin
      EDUGRADE_BOOTSTRAP_PASSWORD: ${EDUGRADE_E2E_ADMIN_PASSWORD:?set by the STORY-060 runner}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: "no"

  provision-story060-users:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    entrypoint: ["api-gateway", "provision-story060-users"]
    environment:
      EDUGRADE_ENV: test
      EDUGRADE_LOG_LEVEL: error
      EDUGRADE_POSTGRES_DSN: postgres://edugrade:story060_e2e_postgres_only@postgres:5432/edugrade?sslmode=disable
      EDUGRADE_E2E_SCHOOL_ADMIN_PASSWORD: ${EDUGRADE_E2E_SCHOOL_ADMIN_PASSWORD:?set by the STORY-060 runner}
      EDUGRADE_E2E_SUBJECTIVE_WORKER_PASSWORD: ${EDUGRADE_E2E_SUBJECTIVE_WORKER_PASSWORD:?set by the STORY-060 runner}
    depends_on:
      bootstrap-admin:
        condition: service_completed_successfully
    restart: "no"

  seed:
    image: postgres:16-alpine
    environment:
      EDUGRADE_POSTGRES_DSN: postgres://edugrade:story060_e2e_postgres_only@postgres:5432/edugrade?sslmode=disable
    volumes:
      - ../../tests/e2e/fixtures/story060-grading-agent.sql:/fixture.sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command: ["psql \"$${EDUGRADE_POSTGRES_DSN}\" -v ON_ERROR_STOP=1 -f /fixture.sql"]
    depends_on:
      provision-story060-users:
        condition: service_completed_successfully
    restart: "no"

  # 默认模型服务返回固定测试结果；此环境验证真实调用和落库链路，不能证明模型评分质量。
  model-stub:
    image: python:3.12-alpine
    environment:
      EDUGRADE_E2E_MODEL_API_KEY: ${EDUGRADE_E2E_MODEL_API_KEY:?set by the STORY-060 runner}
    volumes:
      - ../../tests/e2e/story060_model_stub.py:/e2e/story060_model_stub.py:ro
    command: ["python", "/e2e/story060_model_stub.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8087/v1/models', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 60

  grading-agent:
    build:
      context: ../..
      dockerfile: ai-services/Dockerfile
    environment:
      EDUGRADE_GRADING_AGENT_TOKEN: ${EDUGRADE_E2E_GRADING_TOKEN:?set by the STORY-060 runner}
      EDUGRADE_GRADING_MODEL_BASE_URL: ${EDUGRADE_E2E_MODEL_BASE_URL:-http://model-stub:8087/v1}
      EDUGRADE_GRADING_MODEL_API_KEY: ${EDUGRADE_E2E_MODEL_API_KEY:?set by the STORY-060 runner}
      EDUGRADE_GRADING_MODEL_NAME: qwen3-4b-q4-k-m
      EDUGRADE_GRADING_MODEL_VERSION: Qwen/Qwen3-4B-GGUF:Q4_K_M
      EDUGRADE_GRADING_PROVIDER_KEY: local
      EDUGRADE_GRADING_DEPLOYMENT_KEY: local-qwen3-4b-q4-k-m
      EDUGRADE_GRADING_ADAPTER_TYPE: local_llama_cpp
      EDUGRADE_GRADING_DEPLOYMENT_REGION: on_premise
      EDUGRADE_GRADING_CAPABILITY_PROFILE: local-pilot-v1
      EDUGRADE_GRADING_PROMPT_VERSION: subjective-governed-cn-subject-routing-v6
      EDUGRADE_GRADING_MODEL_TIMEOUT_SECONDS: "230"
      EDUGRADE_GRADING_MODEL_MAX_OUTPUT_TOKENS: "384"
      EDUGRADE_GRADING_MODEL_READY_TIMEOUT_SECONDS: "3"
      EDUGRADE_GRADING_MODEL_QUEUE_TIMEOUT_SECONDS: "5"
      EDUGRADE_GRADING_MODEL_MAX_RETRIES: "1"
    depends_on:
      model-stub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8100/health | grep -q healthy"]
      interval: 2s
      timeout: 2s
      retries: 60

  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    environment:
      EDUGRADE_ENV: test
      EDUGRADE_SERVICE_NAME: story060-e2e-api
      EDUGRADE_HTTP_HOST: 0.0.0.0
      EDUGRADE_HTTP_PORT: 8080
      EDUGRADE_LOG_LEVEL: error
      EDUGRADE_READINESS_TIMEOUT: 3s
      EDUGRADE_SHUTDOWN_TIMEOUT: 5s
      EDUGRADE_HTTP_READ_HEADER_TIMEOUT: 5s
      EDUGRADE_HTTP_READ_TIMEOUT: 15s
      EDUGRADE_HTTP_WRITE_TIMEOUT: 300s
      EDUGRADE_HTTP_IDLE_TIMEOUT: 60s
      EDUGRADE_SESSION_COOKIE_SECURE: "false"
      EDUGRADE_POSTGRES_DSN: postgres://edugrade:story060_e2e_postgres_only@postgres:5432/edugrade?sslmode=disable
      EDUGRADE_REDIS_ADDR: redis:6379
      EDUGRADE_REDIS_PASSWORD: ""
      EDUGRADE_REDIS_DB: "0"
      EDUGRADE_MINIO_ENDPOINT: minio:9000
      EDUGRADE_MINIO_APP_ACCESS_KEY: story060e2e
      EDUGRADE_MINIO_APP_SECRET_KEY: story060_e2e_minio_only_secret
      EDUGRADE_MINIO_USE_SSL: "false"
      EDUGRADE_FILE_BUCKET: story060-e2e-files
      EDUGRADE_FILE_MAX_UPLOAD_BYTES: "10485760"
      EDUGRADE_FILE_ALLOWED_EXTENSIONS: .png,.pdf
      EDUGRADE_BARCODE_ACTIVE_KEY_ID: e2e-v1
      EDUGRADE_BARCODE_HMAC_KEYS: e2e-v1:story060-e2e-barcode-key-at-least-32-chars
      EDUGRADE_QDRANT_URL: ""
      EDUGRADE_AI_SERVICE_URL: http://grading-agent:8100
      EDUGRADE_GRADING_AGENT_TOKEN: ${EDUGRADE_E2E_GRADING_TOKEN:?set by the STORY-060 runner}
      EDUGRADE_AI_SERVICE_TIMEOUT: 250s
      EDUGRADE_AI_SERVICE_MAX_RETRIES: "1"
      EDUGRADE_AI_MODEL_VERSION: Qwen/Qwen3-4B-GGUF:Q4_K_M
      EDUGRADE_AI_PROMPT_VERSION: subjective-governed-cn-subject-routing-v6
      EDUGRADE_AI_MIN_CONFIDENCE: "0.8"
      EDUGRADE_AI_PROVIDER_KEY: local
      EDUGRADE_AI_DEPLOYMENT_KEY: local-qwen3-4b-q4-k-m
      EDUGRADE_AI_ADAPTER_TYPE: local_llama_cpp
      EDUGRADE_AI_DEPLOYMENT_REGION: on_premise
      EDUGRADE_AI_CAPABILITY_PROFILE: local-pilot-v1
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      grading-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health/ready | grep -q '\"status\":\"ready\"'"]
      interval: 2s
      timeout: 2s
      retries: 90

  subjective-grading-worker:
    build:
      context: ../..
      dockerfile: services/subjective-grading-worker/Dockerfile
    environment:
      EDUGRADE_API_BASE_URL: http://api-gateway:8080
      EDUGRADE_SUBJECTIVE_WORKER_TENANT_CODE: platform
      EDUGRADE_SUBJECTIVE_WORKER_USERNAME: story060_subjective_worker
      EDUGRADE_SUBJECTIVE_WORKER_PASSWORD: ${EDUGRADE_E2E_SUBJECTIVE_WORKER_PASSWORD:?set by the STORY-060 runner}
      EDUGRADE_SUBJECTIVE_WORKER_ID: story060-subjective-worker-1
      EDUGRADE_SUBJECTIVE_WORKER_POLL_INTERVAL: "1"
      EDUGRADE_SUBJECTIVE_WORKER_LEASE_SECONDS: "120"
      EDUGRADE_SUBJECTIVE_WORKER_HEARTBEAT_INTERVAL: "5"
      EDUGRADE_SUBJECTIVE_WORKER_HEARTBEAT_TIMEOUT: "2"
      EDUGRADE_SUBJECTIVE_WORKER_HEALTH_MAX_AGE: "30"
    depends_on:
      api-gateway:
        condition: service_healthy
    profiles: ["e2e"]

  e2e-runner:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile.story060
    environment:
      EDUGRADE_E2E_API_BASE_URL: http://api-gateway:8080
      EDUGRADE_E2E_AGENT_BASE_URL: http://grading-agent:8100
      EDUGRADE_E2E_ADMIN_PASSWORD: ${EDUGRADE_E2E_ADMIN_PASSWORD:?set by the STORY-060 runner}
    depends_on:
      api-gateway:
        condition: service_healthy
    profiles: ["e2e"]

  db-verify:
    image: postgres:16-alpine
    environment:
      EDUGRADE_POSTGRES_DSN: postgres://edugrade:story060_e2e_postgres_only@postgres:5432/edugrade?sslmode=disable
    volumes:
      - ../../tests/e2e/fixtures/story060-grading-agent-verify.sql:/verify.sql:ro
      - ../../services/api-gateway/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        expected_migration_count="$$(find /migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
        psql "$${EDUGRADE_POSTGRES_DSN}" -v ON_ERROR_STOP=1 -v expected_migration_count="$${expected_migration_count}" -f /verify.sql
    depends_on:
      api-gateway:
        condition: service_healthy
    profiles: ["e2e"]

  web-admin:
    build:
      context: ../..
      dockerfile: apps/web-admin/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health | grep -q web-admin"]
      interval: 2s
      timeout: 2s
      retries: 90
    profiles: ["e2e"]

  browser-gateway:
    image: nginx:1.29-alpine
    volumes:
      - ./nginx/story060-e2e.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1::80"
    depends_on:
      web-admin:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health | grep -q story060-browser-gateway"]
      interval: 2s
      timeout: 2s
      retries: 60
    profiles: ["e2e"]

volumes:
  postgres_data:
  minio_data:
