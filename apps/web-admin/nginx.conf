server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  location /health {
    access_log off;
    return 200 "web-admin ok\n";
    add_header Content-Type text/plain;
    # add_header 声明会停止继承，因此这里重复配置安全策略。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  }

  # PDF.js 以 ES 模块加载工作线程。部分发行版的 Nginx 默认 MIME 表
  # 不包含 .mjs，而浏览器会拒绝 octet-stream 类型。
  location ~* \.mjs$ {
    types { application/javascript mjs; }
    try_files $uri =404;
  }

  # 本地 OCR 只在这个独立 Worker 内编译 WASM；主页面和其他脚本仍使用上方严格策略。
  # 当前层声明 add_header 后不再继承，因此同时保留全部安全头。
  location ~ ^/assets/worker\.min-[A-Za-z0-9_-]+\.js$ {
    types { application/javascript js; }
    try_files $uri =404;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  }

  location = /ocr/eng.traineddata.gz {
    # 固定模型名不能回落入口页，也不能在发布替换后凭时间和长度误返回旧模型的304。
    try_files $uri =404;
    expires -1;
    etag off;
    if_modified_since off;
  }

  # 入口页每次重新验证，容器更新后才能及时加载新版本的静态资源。
  location = /index.html {
    expires -1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
