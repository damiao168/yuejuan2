version: 2

updates:
  # 普通版本发布满 7 天后再纳入每周更新；cooldown 不适用于安全更新。
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/lab"
    schedule:
