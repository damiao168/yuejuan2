name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm run ci:workflow-lint

  web-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify generated SDK, registered route coverage, and schema compatibility
        run: npm run ci:contracts
      - run: npm run lint
      - run: npm run typecheck

  web-unit:
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - web-admin
          - student-portal
          - desktop-client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --workspace apps/${{ matrix.workspace }} run test
      - name: Measure desktop digest memory and restart recovery
        if: matrix.workspace == 'desktop-client'
        run: node scripts/ci/desktop-digest-memory.mjs

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm --workspace apps/web-admin run check:production-routes
      - run: npm --workspace apps/desktop-client run check:security-config

  node-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            lab/package-lock.json
      - run: npm ci
      - run: npm ci --prefix lab
      - run: npm audit --audit-level=high
      - run: npm --prefix lab audit --audit-level=high

  story-gates:
    strategy:
      fail-fast: false
      matrix:
        include:
          - story: '049'
            command: npm run check:story049
          - story: '052'
            command: npm run check:story052
          - story: '053'
            command: npm run check:story053
          - story: '057'
            command: npm run check:story057
          - story: '061'
            command: npm run check:story061
          - story: '063'
            command: npm run check:story063
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}

  web-e2e-mocked:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lab/package-lock.json
      - run: npm ci --prefix lab
      - run: npm --prefix lab test
      - run: npm --prefix lab run eval
      - run: npm --prefix lab run gate:dev

  desktop-rust:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --check --manifest-path apps/desktop-client/src-tauri/Cargo.toml
      - run: cargo check --locked --manifest-path apps/desktop-client/src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path apps/desktop-client/src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path apps/desktop-client/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Validate recovery PowerShell syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem infra/docker-compose/scripts -Filter *.ps1
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "$($file.Name): $($errors.Message -join '; ')" }
          }

  go-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
          cache-dependency-path: services/api-gateway/go.sum
      - run: go mod verify
      - run: go mod tidy -diff
      - name: Check gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "::error::The following Go files are not formatted:"
            printf '%s\n' "$files"
            exit 1
          fi
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

  go-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
          cache-dependency-path: services/api-gateway/go.sum
      - run: go test ./... -count=1

  go-race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
      - name: Race-test concurrent state machines
        run: >-
          go test -race
          ./internal/auth
          ./internal/idempotency
          ./internal/commandreceipt
          ./internal/workerruntime
          ./internal/files
          ./internal/captureupload
          ./internal/capture
          ./internal/processing
          ./internal/submission
          ./internal/ocr
          ./internal/imagequality
          ./internal/grading
          ./internal/review
          ./internal/subjective
          ./internal/score
          ./internal/modelgovernance
          ./internal/paper
          ./internal/platformschools
          -count=1

  go-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
          cache-dependency-path: services/api-gateway/go.sum
      - run: npm run test:go-coverage
      - run: npm run check:go-coverage

  go-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  go-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: edugrade_e2e
          POSTGRES_USER: edugrade
          POSTGRES_PASSWORD: edugrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edugrade -d edugrade_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        working-directory: .
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
          cache-dependency-path: services/api-gateway/go.sum
      - name: PostgreSQL workflows
        env:
          EDUGRADE_E2E_DATABASE_URL: postgres://edugrade:edugrade@127.0.0.1:5432/edugrade_e2e?sslmode=disable
        run: |
          test -n "${EDUGRADE_E2E_DATABASE_URL}"
          go test ./internal/server -run 'PostgresTestDatabase|PostgresMigrationUpgrade|PostgresManagedConfig|Story056.*E2E|Reliability.*Postgres' -count=1 -v

      - name: Authorization contract against migrated PostgreSQL
        env:
          EDUGRADE_E2E_DATABASE_URL: postgres://edugrade:edugrade@127.0.0.1:5432/edugrade_e2e?sslmode=disable
        run: go test ./internal/auth -run '^TestAuthorizationContractPostgres$' -count=1 -v

      - name: Validate actual handler responses in both clients
        env:
          EDUGRADE_CLIENT_CONTRACT: '1'
        run: go test ./internal/apicontract -run 'TestReliabilitySharedClientContract|HandlerResponsesValidateAgainstOpenAPI' -count=1 -v

  go-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lab/package-lock.json
      - run: npm ci --prefix lab
      - run: npm run check:lab-integration

  architecture-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node scripts/check-architecture-boundaries.mjs
      - run: node --test scripts/ci/architecture-boundaries.test.mjs

  python-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ai-services/requirements.txt
            packages/worker-runtime-python/pyproject.toml
            services/ocr-worker/pyproject.toml
            services/image-quality-worker/pyproject.toml
            services/page-processing-worker/pyproject.toml
            services/subjective-grading-worker/pyproject.toml
            services/math-verification-worker/pyproject.toml
      - run: python -m pip install --upgrade pip==26.1.2 setuptools==83.0.0
      - run: python -m pip install ruff==0.16.0 -r ai-services/requirements.txt -e packages/worker-runtime-python -e services/ocr-worker -e services/image-quality-worker -e services/page-processing-worker -e services/subjective-grading-worker -e services/math-verification-worker
      - run: python -m pip check
      - run: ruff check ai-services packages/worker-runtime-python services/image-quality-worker services/ocr-worker services/page-processing-worker services/subjective-grading-worker services/math-verification-worker lab/evals/math-recognition

  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-services/requirements.txt
      - run: python -m pip install --upgrade pip==26.1.2 setuptools==83.0.0
      - run: >-
          python -m pip install pip-audit==2.10.1
          -r ai-services/requirements.txt
          -e packages/worker-runtime-python
          -e services/ocr-worker
          -e services/image-quality-worker
          -e services/page-processing-worker
          -e services/subjective-grading-worker
          -e services/math-verification-worker
      - name: Audit installed third-party Python packages
        run: |
          python -m pip freeze --exclude-editable > "${RUNNER_TEMP}/audit-requirements.txt"
          if grep -qi '^edugrade-' "${RUNNER_TEMP}/audit-requirements.txt"; then
            echo "Editable EduGrade packages leaked into the audit input."
            exit 1
          fi
          python -m pip_audit --strict -r "${RUNNER_TEMP}/audit-requirements.txt"

  python-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ocr
            package: services/ocr-worker
            install: python -m pip install -e packages/worker-runtime-python -e 'services/ocr-worker[test]'
            command: python -m pytest -q services/ocr-worker/tests
          - name: image-quality
            package: services/image-quality-worker
            install: python -m pip install -e packages/worker-runtime-python -e services/image-quality-worker
            command: python -m pytest -q services/image-quality-worker/tests
          - name: page-processing
            package: services/page-processing-worker
            install: python -m pip install -e packages/worker-runtime-python -e services/page-processing-worker
            command: python -m pytest -q services/page-processing-worker/tests
          - name: subjective-grading
            package: services/subjective-grading-worker
            install: python -m pip install -e packages/worker-runtime-python -e services/subjective-grading-worker
            command: python -m pytest -q services/subjective-grading-worker/tests
          - name: math-verification
            package: services/math-verification-worker
            install: python -m pip install -e services/math-verification-worker
            command: python -m pytest -q services/math-verification-worker/tests
          - name: math-bench
            package: ''
            install: echo "No editable package required"
            command: python -m pytest -q lab/evals/math-recognition/test_math_bench.py
          - name: ai-services
            package: ''
            install: python -m pip install -e packages/worker-runtime-python
            command: python -m unittest discover -s ai-services/tests -p 'test_*.py'
          - name: ai-evaluation
            package: ''
            install: echo "No editable package required"
            command: python -m pytest -q tests/ai-evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ai-services
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip==26.1.2 setuptools==83.0.0
      - run: python -m pip install pytest==9.1.1 -r ai-services/requirements.txt
      - name: Install worker package
        run: ${{ matrix.install }}
      - run: ${{ matrix.command }}

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate main Compose profiles
        run: >-
          docker compose
          --env-file infra/docker-compose/.env.example
          -f infra/docker-compose/docker-compose.yml
          --profile tools
          --profile ocr
          --profile quality
          --profile processing
          --profile subjective-grading
          --profile math
          --profile observability
          config -q
      - name: Validate STORY-056 isolated Compose
        env:
          EDUGRADE_E2E_ADMIN_PASSWORD: ci-story056-admin
          EDUGRADE_E2E_WORKER_PASSWORD: ci-story056-worker
          EDUGRADE_E2E_UNPRIVILEGED_PASSWORD: ci-story056-unprivileged
        run: docker compose -f infra/docker-compose/docker-compose.story056-e2e.yml --profile e2e config -q
      - name: Validate STORY-060 isolated Compose
        env:
          EDUGRADE_E2E_ADMIN_PASSWORD: ci-story060-admin
          EDUGRADE_E2E_SCHOOL_ADMIN_PASSWORD: ci-story060-school-admin
          EDUGRADE_E2E_SUBJECTIVE_WORKER_PASSWORD: ci-story060-subjective-worker
          EDUGRADE_E2E_GRADING_TOKEN: ci-story060-grading-token-at-least-32-characters
          EDUGRADE_E2E_MODEL_API_KEY: ci-story060-model-key
        run: docker compose -f infra/docker-compose/docker-compose.story060-e2e.yml --profile e2e config -q

  compose-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build subjective grading worker image
        run: docker compose --env-file infra/docker-compose/.env.example -f infra/docker-compose/docker-compose.yml --profile subjective-grading build subjective-grading-worker
      - name: Validate subjective grading worker image
        run: >-
          docker run --rm --entrypoint python
          -e EDUGRADE_API_BASE_URL=http://api-gateway:8080
          -e EDUGRADE_SUBJECTIVE_WORKER_TENANT_CODE=ci
          -e EDUGRADE_SUBJECTIVE_WORKER_USERNAME=ci-worker
          -e EDUGRADE_SUBJECTIVE_WORKER_PASSWORD=ci-only-placeholder
          edugrade/subjective-grading-worker:local
          -c "from subjective_grading_worker.config import load_settings; load_settings()"

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: API Gateway SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: services/api-gateway
          format: cyclonedx-json
          output-file: sbom-api-gateway.cdx.json
          upload-artifact: false
      - name: Web Admin SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: apps/web-admin
          format: cyclonedx-json
          output-file: sbom-web-admin.cdx.json
          upload-artifact: false
      - name: Desktop Client SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: apps/desktop-client
          format: cyclonedx-json
          output-file: sbom-desktop-client.cdx.json
          upload-artifact: false
      - name: Python Workers SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: services
          format: cyclonedx-json
          output-file: sbom-python-workers.cdx.json
          upload-artifact: false
      - name: AI Service SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: ai-services
          format: cyclonedx-json
          output-file: sbom-ai-service.cdx.json
          upload-artifact: false
      - name: High and critical vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edugrade-sboms
          path: sbom-*.cdx.json
          if-no-files-found: error

  real-system-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: story060-${{ github.run_id }}-${{ github.run_attempt }}
      EDUGRADE_E2E_ADMIN_PASSWORD: Ci-Story060-Admin!2026
      EDUGRADE_E2E_SCHOOL_ADMIN_PASSWORD: Ci-Story060-School!2026
      EDUGRADE_E2E_SUBJECTIVE_WORKER_PASSWORD: Ci-Story060-Worker!2026
      EDUGRADE_E2E_GRADING_TOKEN: ci-story060-grading-token-at-least-32-characters
      EDUGRADE_E2E_MODEL_API_KEY: ci-story060-model-protocol-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start real isolated system stack
        run: docker compose -f infra/docker-compose/docker-compose.story060-e2e.yml up -d --build --wait --wait-timeout 300 browser-gateway subjective-grading-worker
      - name: Verify real grading-agent and PostgreSQL persistence
        run: |
          docker compose -f infra/docker-compose/docker-compose.story060-e2e.yml run --rm --no-deps e2e-runner
          docker compose -f infra/docker-compose/docker-compose.story060-e2e.yml run --rm --no-deps db-verify
      - name: Resolve isolated browser URL
        run: |
          gateway_port="$(docker compose -f infra/docker-compose/docker-compose.story060-e2e.yml port browser-gateway 80 | awk -F: '{print $NF}')"
          test -n "${gateway_port}"
          echo "EDUGRADE_REAL_E2E_BASE_URL=http://127.0.0.1:${gateway_port}" >> "${GITHUB_ENV}"
      - name: Browser golden path without API interception
        run: npx playwright test --config playwright.real.config.ts
      - name: Preserve failure diagnostics
        if: failure()
        run: docker compose -f infra/docker-compose/docker-compose.story060-e2e.yml logs --no-color --tail 300
      - name: Upload real browser evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-system-e2e-evidence
          path: output/playwright/real-test-results
          if-no-files-found: ignore
      - name: Remove isolated E2E project
        if: always()
        run: docker compose -f infra/docker-compose/docker-compose.story060-e2e.yml down --volumes --remove-orphans

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - workflow-static
      - web-static
      - web-unit
      - web-build
      - node-security
      - story-gates
      - web-e2e-mocked
      - lab
      - go-static
      - go-unit
      - go-race
      - go-coverage
      - go-security
      - go-postgres
      - go-boundary
      - architecture-boundary
      - python-static
      - python-security
      - python-tests
      - desktop-rust
      - compose-config
      - compose-image-smoke
      - supply-chain
      - real-system-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Verify required CI jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {name: data["result"] for name, data in needs.items() if data["result"] != "success"}
          if bad:
              print("Required CI jobs did not succeed:")
              for name, result in bad.items():
                  print(f"- {name}: {result}")
              sys.exit(1)
          print("All required CI jobs succeeded.")
          PY
